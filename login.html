<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href= "login.css">
    <title>Login</title>
</head>
<body>
    <video autoplay muted loop playsinline class="video">
        <source src="hornet-the-princess-protector-of-hallownest-hollow-knight-moewalls-com.mp4" type="video/mp4">
        </video>
    
    <main>
    <form action="">

        <div class="area-titulo">
            <i class="fa-solid fa-user-secret emblema"></i>
            <h1>Portfólio do Arthur</h1>
        </div>

        <div class="campo">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="email" placeholder="Email" required>
        </div>

        <div class="campo">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="senha" placeholder="Senha" required>
        </div>

        <div class="lembrar-senha">
            <label><input type="checkbox" id="lembrar"> Lembre-me</label>
            <a href="#">Esqueceu a Senha?</a>
        </div>

        <div class="area-botao">
            <button>Acessar</button>
            <a href="#">Ainda não possui uma conta.</a>
        </div>

    </form>
</main>

</body>
</html>
